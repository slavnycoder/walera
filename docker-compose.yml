# Quick start: PostgreSQL with a demo table, plus Walera.
#
#   docker compose up
#
# Walera needs your auth backend at WALERA_AUTH_URL (default: port 9000 on
# the docker host; the example backend in docs/auth.md listens there).
# Health, readiness and metrics do not depend on it.
#
# Override with host variables, e.g.:
#   WALERA_TABLES=public.orders WALERA_AUTH_URL=http://host.docker.internal:8000 docker compose up
#
# To run a local build instead of the published image, replace `image:`
# under `walera` with `build: .`.

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: walera
      POSTGRES_PASSWORD: walera
      POSTGRES_DB: walera
    command: ["postgres", "-c", "wal_level=logical"]
    configs:
      - source: demo-schema
        target: /docker-entrypoint-initdb.d/demo.sql
    healthcheck:
      # TCP, so the check stays red while init scripts run on the socket-only server.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U walera -d walera"]
      interval: 2s
      timeout: 2s
      retries: 30

  walera:
    image: ghcr.io/slavnycoder/walera:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The demo role is a superuser; a real one needs only REPLICATION
      # (Walera itself needs no SELECT on the published tables).
      WALERA_DATABASE_URL: "postgres://walera:walera@postgres:5432/walera?sslmode=disable"
      # Walera creates the publication (walera_pub) FOR TABLE from this list.
      WALERA_TABLES: "${WALERA_TABLES:-public.items}"
      WALERA_AUTH_URL: "${WALERA_AUTH_URL:-http://host.docker.internal:9000}"
      # Plain http:// auth URL: local evaluation only.
      WALERA_AUTH_ALLOW_PLAINTEXT: "1"
      WALERA_CORS_ORIGINS: "${WALERA_CORS_ORIGINS:-}"
    ports:
      - "8080:8080"
    extra_hosts:
      # Lets the container reach an auth backend running on the docker host.
      - "host.docker.internal:host-gateway"

configs:
  demo-schema:
    content: |
      CREATE TABLE items (
        id    serial PRIMARY KEY,
        title text NOT NULL,
        done  boolean NOT NULL DEFAULT false
      );
