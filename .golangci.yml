version: "2"

linters:
  enable:
    - errcheck
    - staticcheck
    - govet
    - gosec
    - ineffassign
    - unused
    - misspell
    - exhaustive
    - nilerr
    - bodyclose
  settings:
    exhaustive:
      # Require exhaustive type-switches on pgoutput message types.
      default-signifies-exhaustive: true
  exclusions:
    rules:
      # Test helpers routinely ignore errors and close bodies via t.Cleanup.
      - path: '_test\.go'
        linters:
          - errcheck
          - gosec
          - bodyclose
